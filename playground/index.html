<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extension — extension-sdk playground</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section class="panel">
      <h1>Extension SDK Playground</h1>

      <details class="actions-panel" open>
        <summary>Emit to parent</summary>
        <div class="controls">
          <section class="action-group">
            <h2>Auth token refresh</h2>
            <button id="refresh-auth-token" type="button" disabled>
              Request auth token refresh
            </button>
          </section>
          <section class="action-group">
            <h2>Navigation change</h2>
            <div class="action-group-body">
              <label class="action-field">
                Path
                <input id="nav-path" type="text" value="/demo" disabled />
              </label>
              <button id="notify-navigation" type="button" disabled>
                Notify navigation change
              </button>
            </div>
          </section>
          <section class="action-group">
            <h2>API call</h2>
            <div class="action-group-body">
              <label class="action-field">
                Endpoint
                <input
                  id="api-endpoint"
                  type="text"
                  value="/platform/v1/api/users/me"
                  disabled
                />
              </label>
              <button id="call-api" type="button" disabled>Call API</button>
            </div>
          </section>
        </div>
      </details>

      <div class="columns">
        <details class="column" open>
          <summary>Events</summary>
          <ol id="extension-log" class="log"></ol>
        </details>

        <details class="column" open>
          <summary>Payload</summary>
          <pre id="extension-state" class="status">Connecting…</pre>
        </details>
      </div>
    </section>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
